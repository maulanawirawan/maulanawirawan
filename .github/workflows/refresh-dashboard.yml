name: Refresh dashboard

on:
  schedule:
    - cron: "*/30 * * * *" # every 30 minutes (near-realtime dashboard)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-dashboard
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate dashboard numbers
        run: python tools/refresh_dashboard.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if changed
        run: |
          git config user.name "profile-dashboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/self-scan.svg assets/terminal.svg
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: refresh OSS dashboard [skip ci]"
            git push
          fi
