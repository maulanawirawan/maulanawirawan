name: self-scan dashboard

on:
  schedule:
    - cron: "15 1 * * *"   # tiap hari 01:15 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/scripts/selfscan.py"
      - ".github/workflows/selfscan.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: regenerate self-scan dashboard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/selfscan.py --out assets/self-scan.svg

      - name: commit hasil
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/self-scan.svg
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh self-scan dashboard"
          git push
