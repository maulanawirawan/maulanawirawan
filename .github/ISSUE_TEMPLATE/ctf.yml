name: CTF submission
description: Submit your three secai{...} flags
title: "CTF: "
labels: ["ctf"]
body:
  - type: markdown
    attributes:
      value: |
        Found all three flags? Paste them below. A bot verifies them by
        SHA-256 — no plaintext answers live in this repo. Rules: [CTF.md](https://github.com/maulanawirawan/maulanawirawan/blob/HEAD/CTF.md).
  - type: textarea
    id: flags
    attributes:
      label: Your flags
      description: One `secai{...}` per line, any order.
      placeholder: |
        secai{...}
        secai{...}
        secai{...}
    validations:
      required: true
  - type: input
    id: notes
    attributes:
      label: How did you find them? (optional)
      description: Bragging rights. Which one was the sneakiest?
    validations:
      required: false
