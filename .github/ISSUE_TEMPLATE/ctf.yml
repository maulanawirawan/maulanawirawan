name: CTF submission
description: Prove you found the three secai{...} flags, without posting them
title: "CTF: "
labels: ["ctf"]
body:
  - type: markdown
    attributes:
      value: |
        **Don't paste the flags.** For each one, post a proof instead:
        `sha256("<your-github-username>:<flag>")`, with your username in lowercase.
        A proof only works for your account, so nobody can copy it.

        ```bash
        printf '%s' 'yourname:secai{...}' | sha256sum
        ```

        PowerShell version and full rules: [CTF.md](https://github.com/maulanawirawan/maulanawirawan/blob/HEAD/CTF.md).
  - type: textarea
    id: proofs
    attributes:
      label: Your proofs
      description: Three 64-character hex digests, one per line, any order.
      placeholder: |
        <64 hex chars>
        <64 hex chars>
        <64 hex chars>
    validations:
      required: true
  - type: input
    id: notes
    attributes:
      label: How did you find them? (optional)
      description: Bragging rights. Which one was the sneakiest?
    validations:
      required: false
