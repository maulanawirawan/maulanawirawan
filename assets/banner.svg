<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Maulana Wirawan — detection engineer">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ff2a4d" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#00f0ff" stop-opacity=".18"/>
      <stop offset="1" stop-color="#00f0ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vig" cx=".5" cy=".5" r=".75">
      <stop offset=".55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".85"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2a4d" stop-opacity="0"/>
      <stop offset="1" stop-color="#ff2a4d" stop-opacity=".55"/>
    </linearGradient>
    <pattern id="sl" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000" opacity=".55"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="340" rx="14"/></clipPath>
    <style>
      text { font-family: 'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace; }
      .name { font-size: 78px; font-weight: 800; letter-spacing: 6px; }
      .r { fill: #ff2a4d; animation: gr 3.2s infinite steps(1); }
      .c { fill: #00f0ff; animation: gc 3.2s infinite steps(1); }
      .w { fill: #f4f4f6; animation: gw 3.2s infinite steps(1); }
      @keyframes gr { 0%,100%{transform:translate(-3px,0)} 8%{transform:translate(-9px,2px)} 9%{transform:translate(4px,-2px)} 10%{transform:translate(-3px,0)} 62%{transform:translate(-14px,0)} 63%{transform:translate(-3px,0)} }
      @keyframes gc { 0%,100%{transform:translate(3px,0)} 8%{transform:translate(9px,-2px)} 9%{transform:translate(-4px,2px)} 10%{transform:translate(3px,0)} 62%{transform:translate(14px,0)} 63%{transform:translate(3px,0)} }
      @keyframes gw { 0%,100%{transform:none;opacity:1} 8%{transform:translate(2px,0);opacity:.75} 10%{transform:none;opacity:1} 62%{transform:skewX(-8deg);opacity:.85} 63%{transform:none;opacity:1} }
      .slice { animation: sl 3.2s infinite steps(1); opacity: 0; }
      @keyframes sl { 0%,7%,11%,61%,64%,100%{opacity:0} 8%,62%{opacity:1} }
      .scanbar { animation: sb 4s linear infinite; }
      @keyframes sb { from{transform:translateY(-120px)} to{transform:translateY(360px)} }
      .lines { animation: fl .12s infinite steps(2); }
      @keyframes fl { 0%{opacity:.5} 100%{opacity:.35} }
      .blink { animation: bk 1s infinite steps(1); }
      @keyframes bk { 50%{opacity:0} }
      .radar { transform-origin: 1060px 170px; animation: rot 4s linear infinite; }
      @keyframes rot { to{transform:rotate(360deg)} }
      .blip { animation: bp 4s infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes bp { 0%,20%{opacity:0} 25%{opacity:1} 60%,100%{opacity:0} }
      .hud { fill: #8a8f98; font-size: 13px; letter-spacing: 2px; }
      .tag { fill: #ff2a4d; font-size: 13px; letter-spacing: 3px; font-weight: 700; }
      .sub { fill: #c9ccd3; font-size: 20px; letter-spacing: 1px; }
      .prompt { fill: #39ff14; font-size: 18px; }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="340" fill="#06070b"/>
    <rect width="1200" height="340" fill="url(#grid)"/>

    <!-- radar -->
    <g opacity=".9">
      <circle cx="1060" cy="170" r="110" fill="none" stroke="#ff2a4d" stroke-opacity=".25"/>
      <circle cx="1060" cy="170" r="72" fill="none" stroke="#ff2a4d" stroke-opacity=".2"/>
      <circle cx="1060" cy="170" r="34" fill="none" stroke="#ff2a4d" stroke-opacity=".2"/>
      <path d="M950 170H1170M1060 60V280" stroke="#ff2a4d" stroke-opacity=".15"/>
      <g class="radar">
        <path d="M1060 170 L1170 170 A110 110 0 0 0 1137.8 92.2 Z" fill="url(#sweep)" opacity=".7"/>
        <line x1="1060" y1="170" x2="1170" y2="170" stroke="#ff2a4d" stroke-width="2"/>
      </g>
      <circle class="blip" cx="1112" cy="128" r="4" fill="#ff2a4d"/>
      <circle class="blip" cx="1018" cy="214" r="3" fill="#00f0ff" style="animation-delay:1.6s"/>
      <text x="1060" y="306" text-anchor="middle" class="hud">FP SCANNER</text>
    </g>

    <!-- HUD corners -->
    <path d="M24 60V24H60M1176 60V24H1140M24 280V316H60M1176 280V316H1140" fill="none" stroke="#00f0ff" stroke-width="2" stroke-opacity=".7"/>

    <text x="48" y="54" class="tag">[ SYS://MAULANA.WIRAWAN ]</text>
    <text x="48" y="76" class="hud">NODE JKT-ID · UPLINK SECURE ·</text>
    <circle class="blink" cx="352" cy="71" r="4" fill="#39ff14"/>
    <text x="362" y="76" class="hud" fill="#39ff14" style="fill:#39ff14">ONLINE</text>

    <!-- glitch name -->
    <g>
      <text x="48" y="178" class="name r" textLength="780" lengthAdjust="spacingAndGlyphs">MAULANA WIRAWAN</text>
      <text x="48" y="178" class="name c" textLength="780" lengthAdjust="spacingAndGlyphs">MAULANA WIRAWAN</text>
      <text x="48" y="178" class="name w" textLength="780" lengthAdjust="spacingAndGlyphs">MAULANA WIRAWAN</text>
      <rect class="slice" x="40" y="132" width="800" height="9" fill="#00f0ff" opacity=".8"/>
      <rect class="slice" x="60" y="158" width="620" height="5" fill="#ff2a4d" style="animation-delay:.05s"/>
    </g>

    <text x="50" y="226" class="sub">detection engineer · tool builder · false-positive hunter</text>
    <text x="50" y="276" class="prompt">&gt; proof, not claims<tspan class="blink">█</tspan></text>

    <!-- scanlines + sweep bar + vignette -->
    <g class="lines">
      <rect width="1200" height="340" fill="url(#sl)"/>
    </g>
    <rect class="scanbar" x="0" y="0" width="1200" height="110" fill="url(#scan)"/>
    <rect width="1200" height="340" fill="url(#vig)"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="339" rx="14" fill="none" stroke="#ff2a4d" stroke-opacity=".45"/>
</svg>
