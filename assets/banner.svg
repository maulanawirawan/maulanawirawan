<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Maulana Wirawan — detection engineer">
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2a4d"/>
      <stop offset="1" stop-color="#00f0ff"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="260" rx="14"/></clipPath>
    <style>
      text { font-family: 'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace; }
      .name { font-size: 64px; font-weight: 800; letter-spacing: 4px; }
      .w { fill: #f4f4f6; }
      .r, .c { opacity: 0; }
      .r { fill: #ff2a4d; animation: gr 7s infinite steps(1); }
      .c { fill: #00f0ff; animation: gc 7s infinite steps(1); }
      @keyframes gr { 0%,91%,94%,100% { opacity: 0; transform: none; } 92% { opacity: .9; transform: translate(-5px, 1px); } 93% { opacity: .9; transform: translate(3px, -1px); } }
      @keyframes gc { 0%,91%,94%,100% { opacity: 0; transform: none; } 92% { opacity: .9; transform: translate(5px, -1px); } 93% { opacity: .9; transform: translate(-3px, 1px); } }
      .sub { fill: #a9adb7; font-size: 19px; }
      .prompt { fill: #39ff14; font-size: 17px; }
      .tag { fill: #6b7079; font-size: 13px; letter-spacing: 2px; }
      .blink { animation: bk 1.1s infinite steps(1); }
      @keyframes bk { 50% { opacity: 0; } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="260" fill="#0a0b10"/>
    <rect width="1200" height="3" fill="url(#edge)"/>

    <text x="56" y="62" class="tag">SECURITY TOOLING · DETECTION ENGINEERING · JAKARTA</text>

    <text x="56" y="140" class="name r">MAULANA WIRAWAN</text>
    <text x="56" y="140" class="name c">MAULANA WIRAWAN</text>
    <text x="56" y="140" class="name w">MAULANA WIRAWAN</text>

    <text x="58" y="182" class="sub">I build security tools that show their work.</text>
    <text x="58" y="224" class="prompt">$ proof, not claims<tspan class="blink">_</tspan></text>
  </g>
  <rect x=".5" y=".5" width="1199" height="259" rx="14" fill="none" stroke="#262a33"/>
</svg>
