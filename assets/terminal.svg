      #rc2 { animation: ty2 1.17s steps(13) 1.50s both; }
      #rc3 { animation: ty3 1.35s steps(15) 3.70s both; }
      #rc4 { animation: ty4 1.71s steps(19) 6.10s both; }
      @keyframes ty1 { to { width: 68.4px; } }
      @keyframes ty2 { to { width: 148.2px; } }
      @keyframes ty3 { to { width: 171px; } }
      @keyframes ty4 { to { width: 216.6px; } }
