<svg xmlns="http://www.w3.org/2000/svg" width="590" height="170" viewBox="0 0 590 170" role="img" aria-label="NetJaga">
  <defs>
    <linearGradient id="a" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39ff14"/><stop offset="1" stop-color="#39ff14" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="f"><rect x=".5" y=".5" width="589" height="169" rx="12"/></clipPath>
    <style>
      text { font-family: 'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace; }
      .t { fill: #f4f4f6; font-size: 22px; font-weight: 700; }
      .b { fill: #a9adb7; font-size: 15.5px; }
      .s { fill: #6b7079; font-size: 13.5px; }
      .go { fill: #39ff14; font-size: 13.5px; font-weight: 700; }
    </style>
  </defs>
  <g clip-path="url(#f)">
    <rect width="590" height="170" fill="#0a0b10"/>
    <rect width="590" height="4" fill="url(#a)"/>
    <rect x="1" y="1" width="4" height="168" rx="2" fill="#39ff14"/>
    <text x="28" y="50" class="t">NetJaga</text>
    <text x="28" y="88" class="b">LAN guardian for cafe networks: device monitoring,</text><text x="28" y="112" class="b">allowlists, DNS patrol.</text>
    <circle cx="33" cy="145" r="5" fill="#39ff14"/>
    <text x="46" y="150" class="s">network tooling</text>
    <text x="562" y="150" text-anchor="end" class="go">private repo</text>
